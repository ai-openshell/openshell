name: Setup Rust
description: Configure Rust caches after setup-nix has prepared the development shell

inputs:
  cache-key:
    description: Rust target cache namespace
    required: true
  cache-variant:
    description: Separate persistent targets for matrix variants within one job
    required: false
    default: ""
  save-cache:
    description: Whether this job writes the Rust target cache
    required: false
    default: "false"
  cache-workspace-crates:
    description: Retain workspace build artifacts as well as dependencies
    required: false
    default: "false"

outputs:
  cache-hit:
    description: "true when the cache key matched exactly"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Configure shared sccache on GKE runners
      if: ${{ runner.environment == 'self-hosted' && (startsWith(runner.name, 'openshell-ci-amd64-') || startsWith(runner.name, 'openshell-ci-arm64-')) }}
      shell: nix develop -c bash -euo pipefail {0}
      run: |
        mise install --locked github:mozilla/sccache
        sccache_bin=$(mise which sccache)
        dirname "$sccache_bin" >> "$GITHUB_PATH"
        {
          echo "RUSTC_WRAPPER=$sccache_bin"
          echo "SCCACHE_MEMCACHED_ENDPOINT=tcp://memcached.sccache:11211"
          echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE"
        } >> "$GITHUB_ENV"

    - name: Hash Nix development shell
      id: dev-shell
      shell: bash
      run: |
        shell_drv=$(nix eval --raw --impure .#devShells --apply 'shells: shells.${builtins.currentSystem}.default.drvPath')
        echo "hash=$(nix hash file --type sha256 --base16 "$shell_drv")" >> "$GITHUB_OUTPUT"

    - name: Configure persistent Cargo target directory
      id: persistent-cache
      shell: bash
      env:
        NIX_SHELL_HASH: ${{ steps.dev-shell.outputs.hash }}
        CACHE_VARIANT: ${{ inputs.cache-variant }}
      run: |
        set -euo pipefail
        # Pod environment is visible to the shell, not the workflow env context.
        if [[ -z "${OPENSHELL_PERSISTENT_CACHE:-}" ]]; then
          exit 0
        fi
        echo "enabled=true" >> "$GITHUB_OUTPUT"
        test "$GITHUB_REPOSITORY" = ai-openshell/openshell
        test "$OPENSHELL_PERSISTENT_CACHE" = /mnt/ci-cache
        mountpoint -q "$OPENSHELL_PERSISTENT_CACHE"
        # A slot can run any job. Keep incompatible job/matrix targets separate,
        # independent of branch/run IDs so later runs can reuse their artifacts.
        cache_namespace="$GITHUB_JOB${CACHE_VARIANT:+-$CACHE_VARIANT}"
        [[ "$cache_namespace" =~ ^[a-zA-Z0-9_-]+$ ]]
        [[ "$NIX_SHELL_HASH" =~ ^[a-f0-9]{64}$ ]]
        cache_root="$OPENSHELL_PERSISTENT_CACHE/ai-openshell-openshell/$NIX_SHELL_HASH/$cache_namespace"
        # Keep no-debug artifacts separate from targets with debug information.
        if [[ "${CARGO_PROFILE_TEST_DEBUG:-}" == "0" ]]; then
          cache_root="$cache_root/test-debug0"
        fi
        mkdir -p "$cache_root/target"
        echo "CARGO_TARGET_DIR=$cache_root/target" >> "$GITHUB_ENV"
        echo "Persistent cache slot: $OPENSHELL_CACHE_SLOT"
        echo "Cache namespace: $cache_namespace"
        echo "Runner pod: $RUNNER_NAME"
        echo "Target directory: $cache_root/target"
        du -sh "$cache_root/target"
        df -h "$cache_root/target"

    - name: Cache Rust target and registry
      if: ${{ steps.persistent-cache.outputs.enabled != 'true' }}
      id: cache
      uses: Swatinem/rust-cache@6a7bc3ebce750e0a16a430dd57485acfdb38b05f
      with:
        shared-key: ${{ inputs.cache-key }}-${{ steps.dev-shell.outputs.hash }}
        save-if: ${{ inputs.save-cache }}
        cache-on-failure: ${{ inputs.save-cache }}
        cache-bin: "false"
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}
        cmd-format: nix develop -c {0}
