# Make the gateway push configuration to supervisors.
#
# Adds `[openshell.gateway] config_delivery_mode = "push"` to the gateway
# overrides (the gateway_overrides role), which the `binaries`, `deb` and
# `rpm` installers apply to the gateway's configuration (k3s installers
# ignore it).
---
- name: Gateway configuration push for tests
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Write the configuration delivery mode
      ansible.builtin.include_role:
        name: gateway_overrides
      vars:
        gateway_overrides_name: config-push
        gateway_overrides_content: |
          [openshell.gateway]
          config_delivery_mode = "push"
