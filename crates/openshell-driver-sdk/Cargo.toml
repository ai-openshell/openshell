[package]
name = "openshell-driver-sdk"
description = "Shared helpers for compute drivers launched by the OpenShell gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = { workspace = true }
openshell-crypto = { workspace = true }
openshell-driver-launch = { path = "../openshell-driver-launch" }
openshell-otel = { path = "../openshell-otel" }
tracing = { workspace = true }
openshell-core = { path = "../openshell-core", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
## Helpers for drivers that take `SupervisorOtlpArgs` on their command line.
clap = ["openshell-core/clap"]

[lints]
workspace = true
